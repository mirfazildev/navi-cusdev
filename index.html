<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12615b">
<meta name="description" content="NAVI CustDev suhbat bloknoti">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>NAVI Suhbat Bloknoti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#e9edf1; --surface-3:#dfe5ea;
  --ink:#161c22; --muted:#5c6773; --faint:#8b96a1;
  --line:#d8dee5; --line-soft:#e6ebf0;
  --accent:#12615b; --accent-ink:#ffffff; --accent-soft:#dbeceb;
  --good:#2c6a4c; --good-soft:#dcece3;
  --bad:#9e3626; --bad-soft:#f4e0dc;
  --warn:#8a6210; --warn-soft:#f5e9d2;
  --shadow:0 1px 2px rgba(22,28,34,.07), 0 10px 26px -18px rgba(22,28,34,.4);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2027; --surface-2:#222a32; --surface-3:#2c353e;
  --ink:#e6ebef; --muted:#9ba7b3; --faint:#75828e;
  --line:#2c353e; --line-soft:#232b33;
  --accent:#5fbdb3; --accent-ink:#0d1a19; --accent-soft:#1a302e;
  --good:#75c396; --good-soft:#1c2e25;
  --bad:#e08d7b; --bad-soft:#33201c;
  --warn:#d5a748; --warn-soft:#332818;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -18px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2027; --surface-2:#222a32; --surface-3:#2c353e;
  --ink:#e6ebef; --muted:#9ba7b3; --faint:#75828e;
  --line:#2c353e; --line-soft:#232b33;
  --accent:#5fbdb3; --accent-ink:#0d1a19; --accent-soft:#1a302e;
  --good:#75c396; --good-soft:#1c2e25;
  --bad:#e08d7b; --bad-soft:#33201c;
  --warn:#d5a748; --warn-soft:#332818;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -18px rgba(0,0,0,.85);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px;margin:0 auto;padding:0 14px 120px;}
.hidden{display:none!important;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
.sans{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:9px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;
  display:flex;align-items:center;gap:10px;
}
.bar-back{
  background:none;border:1px solid var(--line);border-radius:20px;
  padding:5px 12px;font-family:"Archivo",sans-serif;font-size:13px;font-weight:600;
  color:var(--muted);
}
.bar-mid{flex:1;min-width:0;}
.bar-title{font-family:"Archivo",sans-serif;font-weight:600;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.bar-sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);display:block;}
.bar-timer{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--accent);
  font-variant-numeric:tabular-nums;}
.prog{height:3px;background:var(--surface-3);margin:0 -14px;position:sticky;top:52px;z-index:19;}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}

/* ---------- home ---------- */
.home-head{padding:34px 0 18px;border-bottom:2px solid var(--ink);}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);font-weight:600;}
h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:31px;line-height:1.05;
  letter-spacing:-.02em;margin:9px 0 8px;}
.lede{color:var(--muted);margin:0;font-size:16px;}

.btn{
  display:block;width:100%;text-align:center;border:none;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);
  font-family:"Archivo",sans-serif;font-weight:600;font-size:17px;
  padding:16px;margin:16px 0 0;
}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn.small{font-size:15px;padding:12px;}
.btn:active{transform:translateY(1px);}

h2{font-family:"Archivo",sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em;
  margin:34px 0 10px;}
h3{font-family:"Archivo",sans-serif;font-weight:600;font-size:16px;margin:0 0 5px;}
p{margin:0 0 12px;}

.prio{display:flex;flex-direction:column;gap:8px;margin:12px 0 0;}
.prio-item{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:0 12px;
  border-left:3px solid var(--line);
}
.prio-item.p1{border-left-color:var(--accent);}
.prio-item.p2{border-left-color:var(--accent);}
.prio-item.p3{border-left-color:var(--warn);}
.prio-item.p4{border-left-color:var(--muted);}
.prio-item.p5{border-left-color:var(--muted);}
.prio-n{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--accent);padding-top:3px;}
.prio-item.p3 .prio-n{color:var(--warn);} .prio-item.p4 .prio-n,.prio-item.p5 .prio-n{color:var(--muted);}
.prio-why{font-size:14.5px;color:var(--muted);margin:2px 0 0;}
.prio-count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);
  display:block;margin-top:5px;letter-spacing:.04em;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:16px 0 0;}
.stat{background:var(--surface);padding:13px 10px;text-align:center;}
.stat b{font-family:"Archivo",sans-serif;font-size:23px;display:block;color:var(--accent);
  font-variant-numeric:tabular-nums;line-height:1.1;}
.stat span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px;}

.rulebox{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:0 8px 8px 0;padding:14px 16px;margin:14px 0;}
.rulebox ul{margin:0;padding-left:18px;}
.rulebox li{margin-bottom:5px;font-size:15.5px;}
.rulebox li:last-child{margin-bottom:0;}
.rb-label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--warn);font-weight:600;display:block;margin-bottom:7px;}

/* ---------- setup ---------- */
.q-setup{margin:22px 0 0;}
.q-setup > label{font-family:"Archivo",sans-serif;font-weight:600;font-size:16.5px;
  display:block;margin-bottom:9px;}
.q-setup .sublab{font-size:14px;color:var(--muted);font-weight:400;display:block;margin-top:2px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{
  border:1px solid var(--line);background:var(--surface);border-radius:22px;
  padding:10px 15px;font-family:"Archivo",sans-serif;font-size:15px;font-weight:500;
}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.txt{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:12px 13px;font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;color:var(--ink);
  line-height:1.5;resize:vertical;
}
.txt::placeholder{color:var(--faint);}

/* ---------- interview ---------- */
.modebar{display:flex;gap:8px;margin:14px 0 4px;align-items:center;}
.modebar .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);
  letter-spacing:.06em;text-transform:uppercase;margin-right:auto;}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px;}
.seg button{border:none;background:none;border-radius:6px;padding:7px 12px;
  font-family:"Archivo",sans-serif;font-size:13.5px;font-weight:600;color:var(--muted);}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

.sec-title{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:26px 0 9px;display:flex;gap:9px;align-items:baseline;
}
.sec-title em{font-family:"Source Serif 4",serif;font-style:italic;font-size:13px;
  color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400;}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:15px 16px 14px;margin-bottom:11px;
}
.card.done{border-color:var(--accent);}
.card.mark{background:var(--surface-2);border-left:3px solid var(--warn);}
.card.mark .qtext{font-size:16px;}
.mark-lab{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-bottom:6px;}
.card .qtext{font-size:18px;line-height:1.4;margin:0 0 4px;}
.card .star{color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:13px;
  font-weight:600;margin-right:5px;}
.card .hint{font-size:14px;color:var(--muted);font-style:italic;margin:0 0 10px;}
.card .qtext + .ansbox{margin-top:10px;}
.scale-wrap{margin:2px 0 4px;}
.scale-lab{display:flex;justify-content:space-between;gap:12px;margin:0 0 7px;
  font-size:13px;color:var(--muted);line-height:1.35;}
.scale-lab b{color:var(--ink);font-family:"IBM Plex Mono",monospace;}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
.sc{
  border:1px solid var(--line);background:var(--surface-2);border-radius:8px;
  padding:11px 0;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;
  color:var(--ink);cursor:pointer;
}
.sc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 9px;}
.chip{
  border:1px solid var(--line);background:var(--surface-2);border-radius:16px;
  padding:6px 11px;font-family:"Archivo",sans-serif;font-size:13.5px;font-weight:500;color:var(--muted);
}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
input.num{
  width:120px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;font-family:"IBM Plex Mono",monospace;font-size:17px;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.tagline{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);
  letter-spacing:.06em;margin-top:9px;display:block;}

.footpad{height:20px;}
.bottombar{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index:25;
}
.bottombar .inner{max-width:640px;margin:0 auto;display:flex;gap:9px;align-items:center;}
.bottombar .btn{margin:0;flex:1;}
.saveflag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--good);
  white-space:nowrap;opacity:0;transition:opacity .3s;}
.saveflag.on{opacity:1;}

/* ---------- archive ---------- */
.rec{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:13px 14px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
}
.rec b{font-family:"Archivo",sans-serif;font-size:15.5px;display:block;}
.rec span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);display:block;margin-top:3px;}
.rec .del{background:none;border:1px solid var(--line);border-radius:7px;padding:7px 10px;
  color:var(--bad);font-family:"Archivo",sans-serif;font-size:13px;font-weight:600;}
.empty{color:var(--faint);font-style:italic;padding:20px 0;text-align:center;}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:40;
  background:var(--ink);color:var(--bg);font-family:"Archivo",sans-serif;font-size:14px;font-weight:600;
  padding:11px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:90%;text-align:center;
}
.toast.on{opacity:1;}
.tsvbox{width:100%;height:150px;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;}
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   NAVI — suhbat bloknoti
   ============================================================ */
const LS_REC='navi_records_v1', LS_DRAFT='navi_draft_v1', LS_CFG='navi_cfg_v1';

/* Sheets manzili kodga yozilgan — localStorage domenga bog'liq bo'lgani uchun
   (localhost / vercel.app / telefon) har safar qayta kiritish shart bo'lmasin.
   Sozlamalarda boshqa manzil saqlansa, o'sha ustun turadi. */
const SHEET_BOLA="1 · Kasb og'rig'i — bola";
const SHEET_OTA="2 · Ota-ona — telefon";
const sheetFor=p=>(((p&&p.who)==='ota')?SHEET_OTA:SHEET_BOLA);
const DEFAULT_SHEETS_URL='https://script.google.com/macros/s/AKfycbxQka5ZQRWDvQD65oysdGtmTUjPRSoaW00T1C6hVV0jvVDbvwoOkJb057F7zVmYsW0EsQ/exec';
const APPS_SCRIPT = "function doPost(e){\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try{\n    var d  = JSON.parse(e.postData.contents);\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sh = d.sheet ? (ss.getSheetByName(d.sheet) || ss.insertSheet(d.sheet)) : ss.getSheets()[0];\n\n    // --- suhbatni o'chirish (ID bo'yicha) ---\n    if(d.action === 'delete'){\n      var n = sh.getLastRow();\n      if(n > 1){\n        var ids = sh.getRange(2, 1, n - 1, 1).getValues();\n        for(var i = ids.length - 1; i >= 0; i--){\n          if(String(ids[i][0]) === String(d.id)) sh.deleteRow(i + 2);\n        }\n      }\n      return out({ok:true, action:'delete', id:d.id});\n    }\n\n    // --- yangi suhbat qo'shish ---\n    if(sh.getLastRow() === 0){\n      sh.appendRow(d.headers);\n      sh.setFrozenRows(1);\n    }\n    var last = sh.getLastRow();\n    var have = [];\n    if(last > 1){\n      have = sh.getRange(2, 1, last - 1, 1).getValues().map(function(r){ return String(r[0]); });\n    }\n    if(have.indexOf(String(d.id)) === -1) sh.appendRow(d.row);\n\n    return out({ok:true, action:'add', id:d.id});\n  }catch(err){\n    return out({ok:false, error:String(err)});\n  }finally{\n    lock.releaseLock();\n  }\n}\n\nfunction out(o){\n  return ContentService.createTextOutput(JSON.stringify(o))\n    .setMimeType(ContentService.MimeType.JSON);\n}";
let DB=null;

/* ---------- profil maydonlari ---------- */
const P_WHO=[['bola',"Bola — 25 daqiqa"],['ota',"Ota-ona — telefon, 5 daqiqa"]];
const P_AGE=[['12-13','12–13'],['14-16','14–16'],['17+','17+']];
const P_LEARN=[
  ['it_off',"IT kursi (offline)"],
  ['it_on',"IT — o'zi, onlayn"],
  ['til',"Til kursi"],
  ['fan',"Fan / repetitor"],
  ['yoq',"Hech qayerga bormaydi"]
];
const P_SRC=[['tanish',"Tanish orqali"],['oquvchi',"Mening o'quvchim"],
             ['maktab',"Maktab orqali"],['boshqa',"Boshqa"]];

/* ---------- bo'limlar · NAVI-custdev-bola-1.md ---------- */
const SECS={
  /* CustDev #1 — bola bilan, 25 daqiqa */
  kirish:["Isinish","1 ta savol — tinglang, tahlil qilmang",'bola'],
  asos:["Asosiy · Kasb noaniqligi","Holat · Og'riq · Harakat",'bola'],
  onlayn:["Onlayn o'rganish","Bizning format ushlab turadimi",'bola'],
  yopilish:["Yopilish","Gap emas, harakat",'bola'],
  xulosa:["Suhbatdan keyin","5 daqiqa — darhol to'ldiring",'bola'],
  /* CustDev #2 — ota-ona bilan telefonda, 5 daqiqa */
  p_savol:["5 ta savol","Telefonda · tartib bilan",'ota'],
  p_yopilish:["Yopilish","30 soniya",'ota'],
  p_xulosa:["Qo'ng'iroqdan keyin","3 daqiqa — darhol to'ldiring",'ota']
};
const SEC_ORDER=['kirish','asos','onlayn','yopilish','xulosa','p_savol','p_yopilish','p_xulosa'];
const secWho=sec=>SECS[sec]?SECS[sec][2]:null;
/* Savol matnidagi [BOLA] o'rniga bolaning ismi qo'yiladi —
   telefonda «farzandingiz» emas, ismini aytish kerak. */
const qText=q=>String(q.q).replace(/\[BOLA\]/g,(state.p&&state.p.child)||'farzandingiz');

/* ---------- savollar · 12 savol + belgilash maydonlari ----------
   c:1 = majburiy · m:1 = siz belgilaysiz, so'ramaysiz
   col  = Google Sheets ustuni nomi                                  */
const Q=[

/* ===== Isinish ===== */
{id:'q1',s:'kirish',c:1,col:"1 · Kecha nima qildi",
 q:"Kecha maktabdan keyin nima qilding? Uyga kelganingdan uxlaguningcha aytib ber.",
 h:"Qisqa aytsa: «keyin nima qilding?» — «keyin?» — «keyin?»",
 chips:["Uyda telefon / o'yin","Kursga bordim","Do'stlar bilan yurdim","Uy vazifasi",
        "Uy ishlari / ukam-singlimga qaradim","Ishladim"]},

/* ===== Asosiy — kasb noaniqligi ===== */
{id:'q2',s:'asos',c:1,col:"2 · Kasb fikri",
 q:"Kelajakda kim bo'lishing haqida hozir qanday fikring bor?",
 h:"Davom: bu fikr qachondan beri shunday? Bir yil oldin ham shu edimi?",
 chips:["Bilmayman / o'ylamaganman","Bir nechta variant bor","Aniq bilaman",
        "Ota-onam aytgan kasb","«Pul topadigan biror narsa»"]},
{id:'q2b',s:'asos',c:1,t:'scale',col:"Ishonch (1-10)",
 q:"Shu fikringga qanchalik ishonasan?",
 lo:"shunchaki aytdim, o'zgarishi mumkin",hi:"aniq shu bo'laman, o'zgarmayman",
 h:"Raqamni bolaning o'zi tanlasin — siz taxmin qilmang."},
{id:'m_holat',s:'asos',c:1,m:1,one:1,col:"◆ Holat",
 q:"Holat — kasbini biladimi?",
 h:"2-savoldagi javobga qarab bittasini tanlang.",
 chips:["Bilmaydi","Taxminan","Aniq"]},

{id:'q3',s:'asos',c:1,col:"3 · Oxirgi marta qachon o'ylagan",
 q:"Kelajaging haqida oxirgi marta qachon o'ylagan eding? Nima sabab bo'ldi?",
 h:"Davom: qayerda eding, kim bilan? Kim nima dedi? Shundan keyin nima his qilding?",
 chips:["Shu hafta","Shu oy","Eslolmayman","Maktabda so'rashdi","Ota-onam gapirdi",
        "Qarindosh so'radi","Video / reels ko'rdim","Do'stim kursga bordi","O'zimcha, sababsiz"]},

{id:'q4',s:'asos',c:1,col:"4 · Nima qilib ko'rgan",
 q:"Bu haqda biror narsa qilib ko'rdingmi — kimdandir so'radingmi, internetdan qidirdingmi, test topshirdingmi?",
 h:"Suhbatdagi eng muhim savol. Davom: nima topding? Foydasi bo'ldimi? Yana qildingmi yoki to'xtading — nega to'xtading?",
 chips:["Hech narsa qilmadim","Ota-onamdan so'radim","Akam / opam / do'stimdan so'radim",
        "YouTube / TikTok'da video ko'rdim","Google'da qidirdim","Test topshirdim","Kursga yozildim"]},
{id:'m_harakat',s:'asos',c:1,m:1,one:1,col:"◆ Harakat",
 q:"Harakat — o'zi biror narsa qilganmi?",
 h:"4-savoldagi javobga qarab bittasini tanlang. «Hech narsa» — to'liq javob: mustaqil yechim izlamagan odam bizning yechimimizni ham sotib olmaydi.",
 chips:["Hech narsa","So'ragan","Qidirgan","Test topshirgan","Kursga borgan"]},

{id:'q5',s:'asos',c:1,t:'scale',col:"◆ Og'riq (1-10)",
 q:"Kim bo'lishingni bilmasliging seni bezovta qiladimi?",
 lo:"umuman bezovta qilmaydi",hi:"har kuni o'ylantiradi",

let state={view:'home',p:null,a:{},meta:{},t0:0,timer:null,mode:'core',records:[]};

const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function activeQs(){return Q.filter(q=>secWho(q.s)===(state.p.who||'bola')&&(!q.w||q.w(state.p)));}
const isXulosa=q=>q.s==='xulosa'||q.s==='p_xulosa';
function visibleQs(){const a=activeQs();return state.mode==='core'?a.filter(q=>q.c||isXulosa(q)):a;}

/* ---------- capabilities ---------- */
(async()=>{
  try{ if(window.claude&&claude.use){ DB=await claude.use('db');
    if(DB){ try{ const snap=await DB.collection('interviews').get();
      const remote=(snap.docs||[]).map(d=>d.data?d.data():d).filter(Boolean);
      if(remote.length){ const loc=lsGet(LS_REC,[]); const ids=new Set(loc.map(r=>r.id));
        remote.forEach(r=>{if(r&&r.id&&!ids.has(r.id))loc.push(r);});
        loc.sort((a,b)=>(b.at||0)-(a.at||0)); lsSet(LS_REC,loc);
        if(state.view==='home'||state.view==='archive')render();
      }}catch(e){}
    }
    if(DB) render();
  }}catch(e){}
})();

function render(){
  const app=$('#app');app.innerHTML='';
  document.querySelectorAll('.bottombar').forEach(n=>n.remove());
  ({home:vHome,setup:vSetup,run:vRun,archive:vArchive,cfg:vCfg}[state.view]||vHome)(app);
  window.scrollTo(0,0);
}

/* ---------- SETUP ---------- */
function vSetup(app){
  const bar=el('div','bar');
  bar.innerHTML=`<button class="bar-back" id="bk">← Orqaga</button>
    <div class="bar-mid"><span class="bar-title">Suhbatdosh haqida</span>
    <span class="bar-sub">Bir necha belgi — keyin savollar chiqadi</span></div>`;
  app.appendChild(bar);
  $('#bk',bar).onclick=()=>{state.view='home';render();};

  const p=state.p;
  const wrap=el('div');
  app.appendChild(wrap);

  function group(label,sub,opts,val,onPick,multi){
    const g=el('div','q-setup');
    g.appendChild(el('label',null,esc(label)+(sub?`<span class="sublab">${esc(sub)}</span>`:'')));
    const o=el('div','opts');
    opts.forEach(([k,t])=>{
      const b=el('button','opt',esc(t));
      const on=multi?val.includes(k):val===k;
      b.setAttribute('aria-pressed',on?'true':'false');
      b.onclick=()=>{onPick(k);draw();};
      o.appendChild(b);
    });
    g.appendChild(o);
    return g;
  }

  function draw(){
    wrap.innerHTML='';
    wrap.appendChild(group("Kim bilan gaplashyapsiz?",null,P_WHO,p.who,k=>{p.who=k;}));

    if(p.who==='bola') wrap.appendChild(group("Yoshi","Nishon — 14–16",P_AGE,p.age,k=>{p.age=k;}));

    wrap.appendChild(group(
      p.who==='bola'?"Hozir qayerda o'qiydi?":"Farzandi qayerda o'qiydi?",
      "Bir nechtasini tanlash mumkin",P_LEARN,p.learn,k=>{
        if(k==='yoq'){p.learn=p.learn.includes('yoq')?[]:['yoq'];}
        else{p.learn=p.learn.filter(x=>x!=='yoq');
          p.learn=p.learn.includes(k)?p.learn.filter(x=>x!==k):p.learn.concat(k);}
      },true));

    if(p.who==='bola')
      wrap.appendChild(group("Qayerdan topildi?","Ustoz-o'quvchi masofasi javobga ta'sir qiladi",
        P_SRC,p.src,k=>{p.src=k;}));

    const txt=(lab,sub,ph,val,on)=>{
      const g=el('div','q-setup');
      g.appendChild(el('label',null,esc(lab)+(sub?`<span class="sublab">${esc(sub)}</span>`:'')));

      i.oninput=e=>{on(e.target.value);};
      g.appendChild(i);wrap.appendChild(g);
    };
    if(p.who==='ota'){

        "masalan: Miraziz",p.child,v=>{p.child=v;});
    }else{
      txt("Ism yoki belgi","Faqat siz uchun — kimligini eslash uchun",
        "masalan: Diyor, 15, 12-maktab",p.name,v=>{p.name=v;});
    }

    const n=visiblePreview();
    const go=el('button','btn',`Boshlash — ${n} ta savol`);

    all.textContent=`Qisqa rejim · barcha savollar: ${activeQsFor(p).length}`;

  }
  function activeQsFor(pp){return Q.filter(q=>secWho(q.s)===(pp.who||'bola')&&(!q.w||q.w(pp)));}
  function visiblePreview(){return activeQsFor(p).filter(q=>q.c||isXulosa(q)).length;}
  draw();
}

/* ---------- export ---------- */
async function copyTSV(ta,btn){
  let ok=false;
  try{ await navigator.clipboard.writeText(ta.value); ok=true; }
  catch(e){
    try{ ta.focus();ta.select();ok=document.execCommand('copy'); }catch(e2){ ok=false; }
  }
  if(!ok){ toast("Nusxa olinmadi — maydondan qo'lda belgilang"); return; }
  toast('Jadval nusxa olindi');
  if(btn){ const t=btn.textContent; btn.textContent='Nusxa olindi ✓';
    setTimeout(()=>{btn.textContent=t;},1400); }
}
function columns(who){
  who=who||'bola';
  const cols = who==='ota'
    ? [['__id','ID'],['sana','Sana'],['davom','Davomiyligi (daq)'],['ism','Ota-ona'],
       ['bola','Bola'],['oqiydi',"Bola qayerda o'qiydi"]]
    : [['__id','ID'],['sana','Sana'],['davom','Davomiyligi (daq)'],['ism','Ism/belgi'],
       ['yosh','Yosh'],['oqiydi',"Qayerda o'qiydi"],['topildi','Qayerdan topildi']];
  const seen=new Set();
  SEC_ORDER.filter(sec=>secWho(sec)===who).forEach(sec=>Q.filter(q=>q.s===sec).forEach(q=>{
    if(seen.has(q.id))return;seen.add(q.id);
    cols.push([q.id,q.col||((SECS[q.s]?SECS[q.s][0]:'')+' — '+q.q)]);
  }));
  return cols;
}
function rowFor(r,cols){
  const L={it_off:'IT kursi (offline)',it_on:'IT onlayn (mustaqil)',til:'Til kursi',
           fan:'Fan/repetitor',yoq:"Hech qayerga bormaydi"};
  const S={tanish:'Tanish orqali',oquvchi:"Mening o'quvchim",maktab:'Maktab orqali',boshqa:'Boshqa'};
  const d=new Date(r.at);
  const base={
    __id:r.id,
    sana:`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`,
    davom:r.dur||'',ism:r.p.name||'',
    bola:r.p.child||'',
    yosh:r.p.age||'',
    oqiydi:(r.p.learn||[]).map(k=>L[k]||k).join(', '),
    topildi:S[r.p.src]||''
  };
  return cols.map(([k])=>String(base[k]!==undefined?base[k]:(r.a&&r.a[k]!==undefined?r.a[k]:'')));
}
function buildTable(recs,sep,who){
  const cols=columns(who);
  const clean=v=>String(v).replace(/[\r\n\t]+/g,' ').trim();
  const lines=[cols.map(c=>clean(c[1])).join(sep)];
  recs.slice().sort((a,b)=>a.at-b.at).forEach(r=>lines.push(rowFor(r,cols).map(clean).join(sep)));
  return lines.join('\n');
}
/* ============================================================
   GOOGLE SHEETS SINXRONIZATSIYASI
   ============================================================ */
function cfg(){
  const c=lsGet(LS_CFG,null);
  if(!c||typeof c.url!=='string')return{url:DEFAULT_SHEETS_URL};
  return c;
}
function setCfg(c){lsSet(LS_CFG,c);}
function unsynced(){return lsGet(LS_REC,[]).filter(r=>!r.synced);}

function payload(rec){
  const cols=columns((rec.p&&rec.p.who)||'bola');
  const clean=v=>String(v==null?'':v).replace(/\r?\n/g,' · ');
  return {id:rec.id,sheet:sheetFor(rec.p),headers:cols.map(c=>c[1]),row:rowFor(rec,cols).map(clean)};
}
async function postTo(url,body){
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,redirect:'follow'});
    if(r.ok)return true;
  }catch(e){}
  try{
    await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    return true;
  }catch(e){return false;}
}
async function deleteOne(rec,url){
  return postTo(url,JSON.stringify({action:'delete',id:rec.id,sheet:sheetFor(rec.p)}));
}
async function pushOne(rec,url){
  return postTo(url,JSON.stringify(payload(rec)));
}
async function syncAll(quiet){
  const c=cfg();
  if(!c.url){if(!quiet)toast("Avval Sheets manzilini kiriting");return;}
  const list=unsynced();
  if(!list.length){if(!quiet)toast("Hammasi yuborilgan");return;}
  if(!quiet)toast(`${list.length} ta yuborilmoqda…`);
  let ok=0;
  for(const rec of list){
    if(await pushOne(rec,c.url)){
      ok++;
      const all=lsGet(LS_REC,[]);
      const i=all.findIndex(x=>x.id===rec.id);
      if(i>-1){all[i].synced=true;lsSet(LS_REC,all);}
    }
  }
  if(!quiet)toast(ok?`${ok} ta yuborildi`:"Yuborilmadi — manzilni tekshiring");
  if(state.view==='archive'||state.view==='home')render();
}

      const demo={id:'test-'+Date.now(),at:Date.now(),dur:0,
        p:{who:'bola',age:'14-16',learn:['yoq'],dec:'yoq',name:'SINOV — o\'chirib tashlang'},a:{}};
      toast('Yuborilmoqda…');
      toast(await pushOne(demo,c.url)?'Yuborildi — jadvalni tekshiring':'Yuborilmadi');
    };
    app.appendChild(t);
    const n=unsynced().length;
    const s=el('button','btn ghost small',`Yuborilmaganlarni yuborish (${n})`);
    s.onclick=()=>syncAll(false);
    app.appendChild(s);
  }
}
